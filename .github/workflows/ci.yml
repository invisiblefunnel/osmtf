name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 06:17 UTC, off the top of the hour, when GitHub delays
    # scheduled runs most.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 26.04 packages osmium-tool 1.19.0, the version README.md cites,
    # for TestOsmiumDifferential.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The minimum from go.mod, and the latest release.
        go: ['1.22', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version
      - name: gofmt
        run: test -z "$(gofmt -d . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  # go test runs only the fuzz targets' seed inputs. This job fuzzes each
  # target with generated inputs, weekly or when started by hand.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzMatchAgainstOracle, FuzzCompile]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go test -fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 10m .
      # On failure, Go writes the input to testdata/fuzz/<target>/<hash> and
      # logs the go test -run command that replays it from there.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-failing-input
          path: testdata/fuzz/${{ matrix.target }}
